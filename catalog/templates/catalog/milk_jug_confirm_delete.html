{% extends 'catalog/base.html' %}

{% block title %}Удаление молочника - Коллекция фарфоровых молочников{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0">Подтвердите удаление</h5>
      </div>
      <div class="card-body">
        <p>Вы уверены, что хотите удалить <strong>{{ milk_jug.name }}</strong>? Это действие нельзя отменить.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'catalog:milk_jug_detail' milk_jug.pk %}" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
