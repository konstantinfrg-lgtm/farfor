{% extends 'catalog/base.html' %}

{% block title %}Пароль сброшен{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Пароль успешно изменён!</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    Ваш пароль был успешно изменён. Теперь вы можете войти с новым паролем.
                </div>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
