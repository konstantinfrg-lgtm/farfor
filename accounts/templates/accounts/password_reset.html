{% extends 'catalog/base.html' %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Забыли пароль?</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Введите email-адрес, связанный с вашим аккаунтом, и мы вышлем ссылку для сброса пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email-адрес</label>
                        {{ form.email }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Отправить ссылку</button>
                        <a href="{% url 'accounts:login' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
